<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>brAIn — perception demo</title>
  <style>
    :root {
      --bg: #0A0A0A; --surface: #111111; --border: #262626;
      --text: #EDEDED; --dim: #A1A1A1; --accent: #4ADE80;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; overflow: hidden; }
    body { display: flex; flex-direction: column; }
    header {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 18px; background: var(--surface); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header .logo { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
    header .logo span { color: var(--accent); }
    header .sub { font-size: 12px; color: var(--dim); }
    header .live {
      margin-left: auto; display: inline-flex; align-items: center; gap: 6px;
      font-size: 11px; color: var(--accent); border: 1px solid var(--border);
      border-radius: 12px; padding: 4px 10px; background: var(--bg);
    }
    header .live .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
      animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: 0.35; } }
    main { flex: 1; display: grid; grid-template-columns: 64% 1fr; gap: 1px;
      background: var(--border); min-height: 0; }
    .col { display: grid; grid-template-rows: 68% 1fr; gap: 1px; min-height: 0; background: var(--border); }
    .tile { position: relative; background: var(--bg); min-height: 0; }
    .tile iframe { width: 100%; height: 100%; border: none; display: block; }
    .tile .tag {
      position: absolute; top: 8px; right: 10px; z-index: 2;
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--dim); background: rgba(10,10,10,0.75); border: 1px solid var(--border);
      border-radius: 4px; padding: 3px 8px; pointer-events: none;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">br<span>AI</span>n</div>
    <div class="sub">demo_video.mp4 → gaze + voice → intent → brain (ollama) → chat</div>
    <div class="live"><span class="dot"></span>LIVE</div>
  </header>
  <main>
    <div class="col">
      <div class="tile"><iframe src="http://localhost:3000/node/GAZE_ID/ui/" title="gaze"></iframe></div>
      <div class="tile"><iframe src="http://localhost:3000/node/VOICE_ID/ui/" title="voice"></iframe></div>
    </div>
    <div class="tile"><iframe src="http://localhost:3000/node/CHAT_ID/ui/" title="chat"></iframe></div>
  </main>
</body>
</html>
