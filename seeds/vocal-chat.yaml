# Vocal-chat: parler au LLM par la voix, voir/répondre dans le chat.
#
# Topology (no attention bridge — brain consumes intent directly):
#
#   voice  ──voice.transcript──────┐
#   gaze   ──gaze.target.resolved──┤
#                                  ▼
#                              intent ──intent.detected───────> chat (visu, every utterance)
#                                     └─intent.addressed──────> consciousness (brain LLM)
#                                       (speaker addressed the AI; carries the
#                                        conversation overheard since last time)
#
#   chat   ──chat.input─────────────> consciousness
#   brain  ──chat.response──────────> chat
#
# Run: `pnpm dev:vocal-chat` (requires `ollama serve` + `ollama pull gemma4:e4b`).
nodes:
  # ── PERCEPTION ────────────────────────────────────────────────
  # voice + gaze keep their default subscriptions / publishes from each
  # node's config.json — no override needed.
  # media-source is the virtual camera + mic: one UI to play a video
  # file into both pipelines in sync (media.play / media.stop on the bus).
  - type: media-source
    name: media
    description: "Virtual camera + mic. Plays a video file into voice + gaze as if it were live input."
    priority: 5
    position: { x: 40, y: 980 }

  - type: voice
    name: voice
    description: "Local STT + diarization. Mic → voice.transcript."
    priority: 5
    position: { x: 40, y: 520 }

  - type: gaze
    name: gaze
    description: "Face detection + gaze direction. Cam → gaze.target.resolved."
    priority: 5
    position: { x: 40, y: 60 }

  # ── CORRELATION ───────────────────────────────────────────────
  # intent's defaults already cover voice.transcript + gaze.target.resolved
  # as inputs and intent.detected as the canonical output.
  - type: intent
    name: intent
    description: "Pairs voice utterances with gaze targets. Emits intent.detected on the bus."
    priority: 5
    position: { x: 620, y: 620 }

  # ── CONSCIOUSNESS ─────────────────────────────────────────────
  # Subscribes to intent.addressed — fired only when a speaker addresses
  # the AI (camera gaze), carrying the conversation overheard since the
  # last exchange — plus chat.input (typed). Humans talking among
  # themselves (intent.detected) do NOT wake the brain; they accumulate
  # as context inside the intent node. Replies via response_topic.
  - type: brain
    name: consciousness
    description: "LLM brain. Hears intent.addressed (spoken to it, with overheard context) + chat.input (typed); replies on chat.response."
    priority: 10
    position: { x: 940, y: 620 }
    subscriptions:
      - topic: "brain.*"
      - topic: "intent.addressed"
      - topic: "chat.input"
      - topic: "chat.reset"
      - topic: "alerts.*"
    config_overrides:
      model: "ollama/gemma4:e4b"
      response_topic: "chat.response"
      idle_sleep: "1m"
      max_steps: 6

  # ── HUMAN INTERFACE ───────────────────────────────────────────
  # chat publishes chat.input by default. We sub it to the brain's
  # replies and the raw correlated utterances so the user sees both
  # the network's "ear" and the LLM's voice.
  - type: chat
    name: human
    description: "Keyboard chat + transcript viewer. Type to talk to the brain; spoken utterances surface here too."
    priority: 5
    position: { x: 620, y: 60 }
    subscriptions:
      - topic: "chat.response"
      - topic: "intent.detected"

  # ── VOICE OUT ─────────────────────────────────────────────────
  # Kokoro-82M neural TTS (pure ONNX in-process, ~86 MB auto-download
  # on first spawn). Subscribed to chat.response: the brain's replies
  # are spoken out loud — the network hears AND answers with a voice.
  - type: tts
    name: voice-out
    description: "Kokoro TTS. Speaks the brain's chat.response replies aloud; emits tts.spoken with the wav path."
    priority: 5
    position: { x: 1260, y: 620 }
    subscriptions:
      - topic: "tts.speak"
      - topic: "tts.cancel"
      - topic: "tts.voices.list"
      - topic: "chat.response"
    config_overrides:
      engine: "kokoro"
      default_voice: "af_heart"
      # Deliberate opt-in: this seed WANTS the room agent to answer out
      # loud. Set false (or remove) to keep replies text-only — the chat
      # UI's 🔊 toggle still works for on-demand speech either way.
      speak_replies: true
